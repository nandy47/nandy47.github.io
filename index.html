<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sushruta Nandy</title>
  <meta name="description" content="Sushruta Nandy — MSAI student at Plaksha University, former data analyst, aspiring technical product manager.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4; --fg: #1d1c1a; --muted: #6b675f; --line: #e4dfd5; --accent: #b4532a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151413; --fg: #ece8e1; --muted: #9a958c; --line: #2c2a27; --accent: #e08a5c; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 400 17px/1.65 "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 680px; margin: 0 auto; padding: 96px 24px 64px; }
    h1 {
      font-family: "Fraunces", Georgia, serif; font-weight: 600;
      font-size: clamp(2.4rem, 6vw, 3.4rem); line-height: 1.1; letter-spacing: -0.02em;
    }
    .avatar {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: block;
      margin-bottom: 28px; border: 1px solid var(--line);
    }
    .tagline { margin-top: 16px; font-size: 1.15rem; color: var(--muted); max-width: 34em; }
    h2 {
      font: 500 0.78rem/1 "Inter", sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin: 64px 0 20px;
    }
    p + p { margin-top: 1em; }
    a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
    a:hover { color: var(--accent); }
    .flow { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
    .flow li { position: relative; padding-right: 16px; }
    .flow li:not(:last-child)::after {
      content: ""; position: absolute; top: 32px; left: 72px; right: 8px; height: 1.5px; background: var(--line);
    }
    .flow li:not(:last-child)::before {
      content: ""; position: absolute; top: 28px; right: 8px; width: 8px; height: 8px;
      border-top: 1.5px solid var(--muted); border-right: 1.5px solid var(--muted); transform: rotate(45deg);
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; overflow: hidden; margin-bottom: 14px;
      font: 600 1.1rem "Fraunces", Georgia, serif; color: #1d1c1a;
    }
    .logo img { width: 86%; height: 86%; object-fit: contain; }
    .flow li.now .logo { border: 2px solid var(--accent); }
    .flow .when { color: var(--muted); font-size: 0.82rem; }
    .flow strong { font-weight: 500; display: block; line-height: 1.35; margin: 2px 0 4px; }
    .flow span { color: var(--muted); font-size: 0.88rem; display: block; line-height: 1.45; }
    .email { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .email svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 28px; }
    footer { margin-top: 80px; font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 520px) {
      main { padding-top: 64px; }
      .flow { grid-template-columns: 1fr; gap: 28px; }
      .flow li { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 0; }
      .flow li:not(:last-child)::after { top: 72px; left: 32px; right: auto; width: 1.5px; height: calc(100% - 52px); }
      .flow li:not(:last-child)::before { display: none; }
      .flow .logo { margin: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="avatar" src="assets/images/profile.jpeg"
